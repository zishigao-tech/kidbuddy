name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag (e.g. v0.1.0). Leave empty for a branch APK test build.
        required: false
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || (inputs.tag || '') }}

jobs:
  # 第一期仅开启 Android 平板 APK 自动打包；有 RELEASE_TAG 时创建草稿 Release 并自动发布，留空时仅出 Actions 测试产物。
  create-release:
    if: ${{ github.event_name == 'push' || inputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create release notes
        run: node scripts/release-notes.mjs --version "${{ env.RELEASE_TAG }}" --output .release-notes.md

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ env.RELEASE_TAG }}"
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --title "KidBuddy ${tag}" \
              --draft \
              --notes-file .release-notes.md
          fi

  build-android:
    needs: [create-release]
    if: ${{ always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK & NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_ENV"

      - name: Ensure gradlew is executable
        shell: bash
        run: |
          sed -i 's/\r$//' src-tauri/gen/android/gradlew
          chmod +x src-tauri/gen/android/gradlew

      - name: Build Android ARM64 APK
        run: npx tauri android build --apk --target aarch64

      - name: Align, sign, and verify APK
        id: sign
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED_APK="src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' -type f | head -1 || true)"
          fi
          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "No unsigned APK generated"
            find src-tauri/gen/android/app/build/outputs/apk -type f || true
            exit 1
          fi

          APP_VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p dist-android
          ALIGNED_APK="$RUNNER_TEMP/kidbuddy-aligned.apk"
          "$ANDROID_BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          HAS_OFFICIAL_SIGNING=true
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_STORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            HAS_OFFICIAL_SIGNING=false
          fi

          if [ "$HAS_OFFICIAL_SIGNING" = "true" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE"
            if [ -n "${{ env.RELEASE_TAG }}" ]; then
              ASSET_NAME="KidBuddy_Android-arm64-${{ env.RELEASE_TAG }}.apk"
            else
              ASSET_NAME="KidBuddy_Android-arm64-v${APP_VERSION}-${SHORT_SHA}.apk"
            fi
            "$ANDROID_BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_STORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "dist-android/${ASSET_NAME}" \
              "$ALIGNED_APK"
            echo "Signed with repository release keystore: ${ASSET_NAME}" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ env.RELEASE_TAG }}" ]; then
            echo "::error::发布正式 Release 必须配置 4 个 GitHub Secrets：ANDROID_KEYSTORE_BASE64、ANDROID_KEY_ALIAS、ANDROID_STORE_PASSWORD、ANDROID_KEY_PASSWORD"
            exit 1
          else
            KEYSTORE_FILE="$RUNNER_TEMP/test.keystore"
            export TEST_KEY_PASS="kidbuddy-ci-test"
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias kidbuddy-test \
              -keyalg RSA -keysize 2048 -validity 365 \
              -storepass "$TEST_KEY_PASS" -keypass "$TEST_KEY_PASS" \
              -dname "CN=KidBuddy CI Test, OU=CI, O=KidBuddy, L=SH, S=SH, C=CN"
            ASSET_NAME="KidBuddy_Android-arm64-v${APP_VERSION}-${SHORT_SHA}-test-signed.apk"
            "$ANDROID_BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias kidbuddy-test \
              --ks-pass env:TEST_KEY_PASS \
              --key-pass env:TEST_KEY_PASS \
              --out "dist-android/${ASSET_NAME}" \
              "$ALIGNED_APK"
            echo "Signed with ephemeral test keystore (configure ANDROID_KEYSTORE_BASE64 secrets for official upgrades): ${ASSET_NAME}" >> "$GITHUB_STEP_SUMMARY"
          fi

          "$ANDROID_BUILD_TOOLS/apksigner" verify --verbose "dist-android/${ASSET_NAME}"
          ls -lh "dist-android/${ASSET_NAME}"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ASSET_NAME%.apk}" >> "$GITHUB_OUTPUT"

      - name: Cleanup temporary signing files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/test.keystore" "$RUNNER_TEMP/kidbuddy-aligned.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign.outputs.artifact_name }}
          path: dist-android/${{ steps.sign.outputs.asset_name }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload Android APK to release
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" "dist-android/${{ steps.sign.outputs.asset_name }}" \
            --repo "${{ github.repository }}" --clobber

  # TODO (Phase 2): 按需接入桌面端与苹果端自动构建与发布：
  # - build-desktop: macOS (Apple Silicon / Intel .dmg)、Windows (x64 .exe)、Linux (.deb)
  # - build-ios: macos-latest 跑 npx tauri ios build（需先在 Apple Developer 配置发布证书与描述文件 Secrets）

  publish-release:
    needs: [build-android]
    if: ${{ github.event_name == 'push' || inputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ env.RELEASE_TAG }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest
