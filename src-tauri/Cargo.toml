[package]
name = "kidbuddy"
version = "0.1.2"
description = "KidBuddy - Local-first AI Companion Desktop App for Kids"
authors = ["KidBuddy Team"]
edition = "2021"

[lib]
name = "kidbuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31.0", features = ["bundled"] }
uuid = { version = "1.8.0", features = ["v4"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }
base64 = "0.22"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
